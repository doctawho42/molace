[project]
name = "molace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "doctawho42", email = "plomoshnovnikita00@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pytdc>=0.4.1",
    "pyyaml>=6.0.3",
    "rdkit>=2026.3.6",
    "rogi>=0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "setuptools<81",
]

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# The suite is tests/ only. Without testpaths, a bare `pytest` walks into data/raw, where the
# cloned upstream repositories carry their own test files, and collection dies on their imports.
testpaths = ["tests"]
norecursedirs = ["data", ".venv", ".superpowers", "results", "docs"]
